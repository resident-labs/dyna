name: Managed Linux image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # pacstrap and systemd-nspawn need Arch Linux and a privileged container.
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install image tools
        run: |
          pacman -Syu --noconfirm --needed arch-install-scripts git go npm pkgconf curl zstd sudo
          # uid 1001 is the runner user on GitHub-hosted machines, so the
          # runner can still read the workspace and its temp folder.
          useradd -m -u 1001 builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v6
      - name: Give the checkout to the build user
        run: chown -R builder "$GITHUB_WORKSPACE"
      - name: Build root filesystem
        run: sudo -u builder image/build.sh "${{ runner.temp }}/dyna-image-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Boot and smoke test
        run: sudo -u builder image/smoke.sh "${{ runner.temp }}/dyna-image-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dyna-linux-x86_64
          path: |
            ${{ runner.temp }}/dyna-image-${{ github.run_id }}-${{ github.run_attempt }}/dyna.tar.zst
            ${{ runner.temp }}/dyna-image-${{ github.run_id }}-${{ github.run_attempt }}/dyna.tar.zst.sha256
            ${{ runner.temp }}/dyna-image-${{ github.run_id }}-${{ github.run_attempt }}/packages.lock
          compression-level: 0
