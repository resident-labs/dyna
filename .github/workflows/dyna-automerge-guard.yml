name: dyna-automerge-guard
# An approval is for one exact head. GitHub keeps auto-merge armed when a PR gets a new push, so
# this switches it off on any push that isn't a plain main merge onto the armed head by arismoko.
# Rearm at the new approved sha. Reads no PR code.
on:
  pull_request_target:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  disarm:
    if: github.repository == 'resident-labs/dyna' && github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Switch auto-merge off unless the push is a main merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          parents=$(gh api "repos/$REPO/commits/$AFTER" --jq '[.parents[].sha] | join(" ")')
          set -- $parents
          if [ "$SENDER" = "arismoko" ] && [ $# -eq 2 ] && [ "$1" = "$BEFORE" ]; then
            status=$(gh api "repos/$REPO/compare/$2...main" --jq .status)
            if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
              echo "Main merge onto the armed head; auto-merge stays."
              exit 0
            fi
          fi
          gh pr merge "$PR" -R "$REPO" --disable-auto
          echo "New head $AFTER after the armed head $BEFORE: auto-merge switched off. Rearm at the new approved sha." >> "$GITHUB_STEP_SUMMARY"
