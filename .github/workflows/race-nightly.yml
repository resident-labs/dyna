name: Race nightly

# Runs every v2 Go test with the race detector on main. It has no time budget
# and is not a PR or push check. A failure opens a GitHub issue labelled
# ci-race, or comments on the open one.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-nightly
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - name: Test with the race detector
        shell: bash
        run: |
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" XDG_CACHE_HOME="$(mktemp -d)"
          bash next/scripts/ci.sh race

  report:
    needs: race
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the ci-race issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-race --description "Nightly race detector run failed" --color B60205 2>/dev/null || true
          number=$(gh issue list --label ci-race --state open --limit 1 --json number --jq '.[0].number // empty')
          body="The nightly race run failed on main: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label ci-race --title "Nightly race run failed" --body "$body"
          fi
