name: CI

on:
  push:
    branches: [main, 'dyna/merge-trial/**']
  pull_request:
    # ready_for_review starts CI when a draft is released.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit needs completed evidence for first-parent attribution.
  # PR revisions still share a group so newer heads replace older PR runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One cheap job decides which suites a change needs. PRs run only the suites
  # their files touch. Main and merge-trial pushes always run everything.
  # Draft PRs run nothing.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      go: ${{ steps.filter.outputs.go }}
      computers: ${{ steps.filter.outputs.computers }}
      web: ${{ steps.filter.outputs.web }}
      pi: ${{ steps.filter.outputs.pi }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: third_party/pi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: third_party/pi/package-lock.json
      # The upstream prepare script installs Husky hooks. CI does not need Git
      # hooks, and the build and tests need no dependency install scripts.
      - name: Install Pi dependencies
        run: npm ci --ignore-scripts
      - name: Hydrate the pinned model catalog offline
        run: bash ../../scripts/pi-hydrate.sh
      - name: Build Pi without live catalog updates
        run: npm run build:offline
      - name: Test coding-agent configuration
        run: npm test --workspace=@earendil-works/pi-coding-agent -- test/args.test.ts test/config.test.ts test/settings-manager.test.ts
      - name: Pack and verify the fork tarball
        working-directory: .
        env:
          PI_PACK_SKIP_BUILD: "1"
        run: bash scripts/pi-pack.sh "${RUNNER_TEMP}/pi-fork.tgz"

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
      - name: Check relay and export JUnit
        run: bash ../scripts/ci.sh relay
        env:
          JUNIT_REPORT_PATH: ${{ runner.temp }}/relay-test.xml
      - name: Upload relay test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-report
          path: ${{ runner.temp }}/relay-test.xml
          if-no-files-found: error
          retention-days: 1

  # Saves the shared Go build and module cache on main. Only main caches are
  # readable by every pull request and merge trial. The cache holds the objects
  # for the tests, vet and the CI checker, so every Go job starts warm. Run it by hand with workflow_dispatch on main to refresh it.
  #
  # This job compiles from an empty build cache on purpose. Go keeps every
  # object it ever built, so restoring the previous cache here made the saved
  # archive grow with each main push: 5.75 GB after a few dozen commits, and a
  # restore alone took over two minutes on every Go job. A cache built only from
  # this commit is complete for the moment it is saved, and objects are
  # content-addressed, so a pull request still hits every package it did not
  # change. The module cache is downloaded again too, which is one network wait
  # that does not grow.
  cache-warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /home/runner/.cache/go-build
      GOMODCACHE: /home/runner/go/pkg/mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          # The explicit cache steps below restore the shared go-build and go-mod
          # caches, so setup-go must not restore the same paths as well: two
          # restores of one module cache collide with "File exists".
          cache: false
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Compile every Go object the other jobs need
        run: |
          mkdir -p web/dist && touch web/dist/.keep
          go build -o /tmp/dyna-ci ./cmd/dyna
          go vet ./...
          go test -run '^$' ./... >/dev/null
          # The desktop is its own module, so the root ./... skips it. Warm it
          # with the same flags its check uses (CGO_ENABLED=0 in scripts/ci.sh),
          # or the objects have different build ids and the shard still pays a
          # cold compile of the whole module in the middle of its job.
          (cd desktop && touch ../web/dist/index.html && CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go test -run '^$' ./... >/dev/null)
          go clean -testcache
      - name: Report the cache size
        # A jump here is what makes a restore slow again, so the size is visible
        # in the run that saved it.
        run: du -sh /home/runner/.cache/go-build /home/runner/go/pkg/mod
      - uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: go-build-${{ github.sha }}

  # Go tests run in parallel shards balanced by measured package time (see
  # scripts/ci-shard.sh). Each shard keeps its own JUnit report and budget check.
  # Jobs run on the bare runner: it skips the Go image pull, and setup-go is fast.
  # Every Go job restores the one shared build cache that cache-warm saves on main.
  go-shard:
    name: go-test-shard (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Go's own test timeout is 5 minutes. The runner slot hooks expect 30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GOCACHE: /home/runner/.cache/go-build
      GOMODCACHE: /home/runner/go/pkg/mod
      CI_SHARD: ${{ matrix.shard }}/9
      # The slowest package, internal/pr/watch, is split across shards 0, 7 and 8.
      CI_SLICE: ${{ matrix.shard == 0 && '0/3' || matrix.shard == 7 && '1/3' || matrix.shard == 8 && '2/3' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          # The explicit cache steps below restore the shared go-build and go-mod
          # caches, so setup-go must not restore the same paths as well: two
          # restores of one module cache collide with "File exists".
          cache: false
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      # go test pipes its results through the checker.
      - name: Build CI checker
        run: bash scripts/ci.sh go build
      - name: Test
        # Each run gets empty home, data, config and cache folders, so no test reaches the
        # runner user's own Dyna (testsafe guards this inside the tests too).
        shell: bash
        run: |
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" XDG_CACHE_HOME="$(mktemp -d)"
          bash scripts/ci.sh go test
      - name: Upload Go test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload raw Go test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-raw-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # Module check, vet and installer lint run beside the test shards.
  go-static:
    name: go-static
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: /home/runner/.cache/go-build
      GOMODCACHE: /home/runner/go/pkg/mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          # The explicit cache steps below restore the shared go-build and go-mod
          # caches, so setup-go must not restore the same paths as well: two
          # restores of one module cache collide with "File exists".
          cache: false
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
      - name: Verify modules
        run: bash scripts/ci.sh go modules
      - name: Check formatting
        run: bash scripts/ci.sh go format
      - name: Vet
        run: bash scripts/ci.sh go vet
      - name: Check installer
        run: bash scripts/ci.sh go installer
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-static-diagnostics
          path: ${{ runner.temp }}/ci-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # The desktop is its own Go module, so the root ./... skips it. It gets a job
  # of its own: its test binary is linked and started here, which cost the test
  # shards about 25 seconds they did not have room for. It needs no WebKit and
  # no cgo, and a stub page stands in for the assets no build produced.
  desktop:
    name: desktop
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: /home/runner/.cache/go-build
      GOMODCACHE: /home/runner/go/pkg/mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          # The explicit cache steps below restore the shared go-build and go-mod
          # caches, so setup-go must not restore the same paths as well: two
          # restores of one module cache collide with "File exists".
          cache: false
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cache/go-build
            /home/runner/go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      - name: Build CI checker
        run: bash scripts/ci.sh go build
      - name: Desktop module
        working-directory: desktop
        shell: bash
        run: |
          touch ../web/dist/index.html
          bash ../scripts/ci.sh go desktop
      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: ${{ runner.temp }}/desktop-test.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics
          path: ${{ runner.temp }}/ci-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # The single check name that Dyna and branch protection wait on. It passes
  # only when every shard and static job passed.
  test:
    name: go-test
    needs: [changes, go-shard, go-static, desktop, frontend, frontend-check]
    if: ${{ always() && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Go job
        env:
          WEB: ${{ needs.changes.outputs.web }}
          RESULTS: ${{ needs.go-shard.result }} ${{ needs.go-static.result }} ${{ needs.desktop.result }} ${{ needs.frontend.result }} ${{ needs.frontend-check.result }}
          FRONTEND_CHECK: ${{ needs.frontend-check.result }}
        run: |
          echo "Results: $RESULTS"
          # frontend-check is skipped when no web file changed.
          if [ "$WEB" != true ] && [ "$FRONTEND_CHECK" = skipped ]; then
            RESULTS="${RESULTS% *} success"
          fi
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "A Go job ended with $r" >&2; exit 1; fi
          done

  # The frontend suite runs in one job per shard, so no single job spends the
  # room's time budget alone. The build is its own job: the test shards need no
  # built assets, and this one also checks that a build leaves the tree clean.
  frontend-build:
    name: frontend build
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend and require a clean tree
        run: bash ../scripts/ci.sh frontend build
      # computer-smoke reads these assets.
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # FRONTEND_SHARD splits the test files, as the local lane does, so each shard
  # reports its own JUnit file and stays well inside the time budget. The name
  # does not start with the aggregate's name, so a shard and the aggregate can
  # never be mistaken for one another.
  frontend-shard:
    name: frontend test (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, part: '1/6' }
          - { shard: 1, part: '2/6' }
          - { shard: 2, part: '3/6' }
          - { shard: 3, part: '4/6' }
          - { shard: 4, part: '5/6' }
          - { shard: 5, part: '6/6' }
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test frontend shard and export JUnit
        run: bash ../scripts/ci.sh frontend test-shard
        env:
          FRONTEND_SHARD: ${{ matrix.part }}
          JUNIT_REPORT_PATH: ${{ runner.temp }}/frontend-test-${{ matrix.shard }}.xml
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/frontend-test-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 1

  # The single frontend check name that the merge gate and the go-test job wait
  # on. It passes only when the build and every shard passed.
  frontend:
    name: frontend
    needs: [changes, frontend-build, frontend-shard]
    if: ${{ always() && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and every shard
        env:
          WEB: ${{ needs.changes.outputs.web }}
          RESULTS: ${{ needs.frontend-build.result }} ${{ needs.frontend-shard.result }}
        run: |
          # No web file changed: the jobs were skipped, so report success.
          if [ "$WEB" != true ]; then echo "No web change; frontend jobs skipped"; exit 0; fi
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "A frontend job ended with $r" >&2; exit 1; fi
          done

  frontend-check:
    name: frontend-check
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check the frontend
        run: bash ../scripts/ci.sh frontend check

  computer-smoke:
    # Live tests need host GUI tools, installed below. They run alone, without
    # the checker build or the frontend assets, to stay inside the time budget.
    needs: [changes]
    if: needs.changes.outputs.computers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
      DYNA_COMPUTERS_ENABLED: '0'
      DYNA_COMPUTERS_REQUIRE_LIVE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The Azure apt mirror is the real problem, not a hung apt: the four
      # megabytes these packages need sometimes arrive at 38 kB/s, which took the
      # install to 186 s and failed a merge trial, while the unpack itself is 3 s.
      # So keep the .deb files in a cache, fetch a cold cache in parallel, and
      # bound every call so a real stall fails with a reason near three minutes.
      - name: Restore apt package cache
        id: apt-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-debs/*.deb
          # A fresh key per run keeps a package update from freezing the cache:
          # the exact key never matches, and the prefix finds the newest set, so
          # the save below always stores what this run downloaded.
          key: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-${{ github.run_id }}
          restore-keys: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-
      - name: Install GUI tools
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 200))
          arch=$HOME/.apt-debs
          mkdir -p "$arch/partial"
          apt_opts=(-o Dir::Cache::archives="$arch"
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # bounded <cap-seconds> <command...> never runs past the deadline.
          bounded() {
            local cap=$1 left
            shift
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then
              echo "install budget exhausted before: $*" >&2
              return 1
            fi
            if [ "$cap" -lt "$left" ]; then
              left=$cap
            fi
            timeout --kill-after=5 "$left" "$@"
          }
          # retry <cap-seconds> <command...> retries once, inside the deadline.
          retry() {
            local cap=$1
            shift
            bounded "$cap" "$@" || { echo "retrying: $*" >&2; bounded "$cap" "$@"; }
          }
          # The index is needed to resolve the packages and costs a few seconds.
          retry 60 sudo apt-get "${apt_opts[@]}" update -qq
          # One slow request must not stall the step: fetch the package files
          # eight at a time. apt skips whatever is already in its archive
          # directory, so this only ever removes work from the install below.
          packages=(labwc xwayland sqlite3)
          uris=$(bounded 40 sudo apt-get "${apt_opts[@]}" install -y -qq --print-uris \
            --no-install-recommends "${packages[@]}" |
            sed -n "s/^'\(https\?:\/\/[^']*\.deb\)'.*/\1/p") || uris=""
          if [ -n "$uris" ]; then
            # curl's own caps, not an inner timeout: a nested timeout would put
            # each worker in its own process group, where the outer bounded
            # cannot reach it.
            printf '%s\n' "$uris" |
              bounded 90 xargs -P 8 -n 1 curl -fsSL --connect-timeout 15 --max-time 45 \
                -O --output-dir "$arch" ||
              echo "parallel fetch incomplete; apt will fetch the rest"
          fi
          retry 120 sudo apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends "${packages[@]}" >/dev/null
          bounded 60 npm install -g agent-browser
          sudo loginctl enable-linger "$USER"
      - name: Save apt package cache
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-debs/*.deb
          key: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-${{ github.run_id }}
      - name: Live computer and cleanup tests
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          systemd-run --user --scope --quiet -p TasksMax=600 -p MemoryMax=2G -- go test -count=1 -timeout 5m ./internal/computers
