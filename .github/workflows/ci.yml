name: CI

on:
  push:
    branches: [main, 'dyna/merge-trial/**']
  pull_request:
    # ready_for_review starts CI when a draft is released.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit needs completed evidence for first-parent attribution.
  # PR revisions still share a group so newer heads replace older PR runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One cheap job decides which suites a change needs. PRs run only the suites
  # their files touch. Main and merge-trial pushes always run everything.
  # Draft PRs run nothing.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      go: ${{ steps.filter.outputs.go }}
      computers: ${{ steps.filter.outputs.computers }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
      - name: Check relay and export JUnit
        run: bash ../scripts/ci.sh relay
        env:
          JUNIT_REPORT_PATH: ${{ runner.temp }}/relay-test.xml
      - name: Upload relay test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-report
          path: ${{ runner.temp }}/relay-test.xml
          if-no-files-found: error
          retention-days: 1

  # The Android call app: compiles it and runs its JVM tests. The emulator scripts in
  # mobile/android/e2e need KVM and stay manual. The runner image ships the Android
  # SDK in ANDROID_HOME; scripts/ci.sh installs missing platforms.
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test the Android app
        run: bash scripts/ci.sh android

  # Saves the shared Go build and module cache on main. Only main caches are
  # readable by every pull request and merge trial. The cache holds the objects
  # for the tests, vet and the CI checker, so every Go job starts warm. Run it by hand with workflow_dispatch on main to refresh it.
  cache-warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: golang:1.26.3
    env:
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /go/pkg/mod
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      - name: Compile every Go object the other jobs need
        run: |
          mkdir -p web/dist && touch web/dist/.keep
          go build -o /tmp/dyna-ci ./cmd/dyna
          go vet ./...
          go test -run '^$' ./... >/dev/null
          go clean -testcache
      - uses: actions/cache/save@v4
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-build-${{ github.sha }}

  # Go tests run in parallel shards balanced by measured package time (see
  # scripts/ci-shard.sh). Each shard keeps its own JUnit report and budget check.
  # Jobs run on the bare runner: it skips the Go image pull, and setup-go is fast.
  # Every Go job restores the one shared build cache that cache-warm saves on main.
  go-shard:
    name: go-test-shard (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Go's own test timeout is 5 minutes. The runner slot hooks expect 30.
    timeout-minutes: 30
    container:
      image: golang:1.26.3
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /go/pkg/mod
      CI_SHARD: ${{ matrix.shard }}/8
      # The slowest package, internal/pr/watch, is split across shards 0 and 7.
      CI_SLICE: ${{ matrix.shard == 0 && '0/2' || matrix.shard == 7 && '1/2' || '' }}
    steps:
      - uses: actions/checkout@v6
      # The container runs as root, but the runner user owns the workspace.
      # Git then refuses the repo, and go build fails with
      # "error obtaining VCS status".
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      # go test pipes its results through the checker.
      - name: Build CI checker
        run: bash scripts/ci.sh go build
      - name: Test
        # Each run gets empty home, data, config and cache folders, so no test reaches the
        # runner user's own Dyna (testsafe guards this inside the tests too).
        shell: bash
        run: |
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" XDG_CONFIG_HOME="$(mktemp -d)" XDG_CACHE_HOME="$(mktemp -d)"
          bash scripts/ci.sh go test
      # The desktop is its own Go module, so the root ./... skips it. It needs
      # no WebKit and no cgo. No built frontend exists in this job, so a stub
      # page stands in for the assets.
      - name: Desktop module
        if: matrix.shard == 4
        working-directory: desktop
        shell: bash
        run: |
          touch ../web/dist/index.html
          bash ../scripts/ci.sh go desktop
      - name: Upload Go test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload raw Go test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-raw-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload desktop test report
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: ${{ runner.temp }}/desktop-test.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # Module check, vet and installer lint run beside the test shards.
  go-static:
    name: go-static
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: golang:1.26.3
    env:
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /go/pkg/mod
    steps:
      - uses: actions/checkout@v6
      # The container runs as root, but the runner user owns the workspace.
      # Git then refuses the repo, and go build fails with
      # "error obtaining VCS status".
      - name: Trust workspace
        run: |
          echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
          echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-build-${{ github.sha }}
          restore-keys: go-build-
      - name: Install shellcheck
        run: apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
      - name: Verify modules
        run: bash scripts/ci.sh go modules
      - name: Vet
        run: bash scripts/ci.sh go vet
      - name: Check installer
        run: bash scripts/ci.sh go installer
      - name: Upload Go diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-static-diagnostics
          path: ${{ runner.temp }}/ci-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # The single check name that Dyna and branch protection wait on. It passes
  # only when every shard and static job passed.
  test:
    name: go-test
    needs: [changes, go-shard, go-static, frontend, frontend-check]
    if: ${{ always() && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Go job
        env:
          RESULTS: ${{ needs.go-shard.result }} ${{ needs.go-static.result }} ${{ needs.frontend.result }} ${{ needs.frontend-check.result }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "A Go job ended with $r" >&2; exit 1; fi
          done

  frontend:
    name: frontend
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Its own job, so the frontend build and tests do not spend go-test's time
    # budget, and both run at once.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test frontend and export JUnit
        run: bash ../scripts/ci.sh frontend test
        env:
          JUNIT_REPORT_PATH: ${{ runner.temp }}/frontend-test.xml
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: ${{ runner.temp }}/frontend-test.xml
          if-no-files-found: error
          retention-days: 1
      # computer-smoke reads these assets.
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  frontend-check:
    name: frontend-check
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type-check the frontend
        run: bash ../scripts/ci.sh frontend check

  computer-smoke:
    # Live tests need host GUI tools, installed below. They run alone, without
    # the checker build or the frontend assets, to stay inside the time budget.
    needs: [changes]
    if: needs.changes.outputs.computers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
      DYNA_COMPUTERS_ENABLED: '0'
      DYNA_COMPUTERS_REQUIRE_LIVE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The Azure apt mirror is the real problem, not a hung apt: the four
      # megabytes these packages need sometimes arrive at 38 kB/s, which took the
      # install to 186 s and failed a merge trial, while the unpack itself is 3 s.
      # So keep the .deb files in a cache, fetch a cold cache in parallel, and
      # bound every call so a real stall fails with a reason near four minutes.
      - name: Restore apt package cache
        id: apt-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/.apt-debs/*.deb
          # A fresh key per run keeps a package update from freezing the cache:
          # the exact key never matches, and the prefix finds the newest set, so
          # the save below always stores what this run downloaded.
          key: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-${{ github.run_id }}
          restore-keys: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-
      - name: Install GUI tools
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 200))
          arch=$HOME/.apt-debs
          mkdir -p "$arch/partial"
          apt_opts=(-o Dir::Cache::archives="$arch"
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # bounded <cap-seconds> <command...> never runs past the deadline.
          bounded() {
            local cap=$1 left
            shift
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then
              echo "install budget exhausted before: $*" >&2
              return 1
            fi
            if [ "$cap" -lt "$left" ]; then
              left=$cap
            fi
            timeout --kill-after=5 "$left" "$@"
          }
          # retry <cap-seconds> <command...> retries once, inside the deadline.
          retry() {
            local cap=$1
            shift
            bounded "$cap" "$@" || { echo "retrying: $*" >&2; bounded "$cap" "$@"; }
          }
          # The index is needed to resolve the packages and costs a few seconds.
          retry 60 sudo apt-get "${apt_opts[@]}" update -qq
          # One slow request must not stall the step: fetch the package files
          # eight at a time. apt skips whatever is already in its archive
          # directory, so this only ever removes work from the install below.
          packages=(labwc xwayland sqlite3)
          uris=$(bounded 40 sudo apt-get "${apt_opts[@]}" install -y -qq --print-uris \
            --no-install-recommends "${packages[@]}" |
            sed -n "s/^'\(https\?:\/\/[^']*\.deb\)'.*/\1/p") || uris=""
          if [ -n "$uris" ]; then
            # curl's own caps, not an inner timeout: a nested timeout would put
            # each worker in its own process group, where the outer bounded
            # cannot reach it.
            printf '%s\n' "$uris" |
              bounded 90 xargs -P 8 -n 1 curl -fsSL --connect-timeout 15 --max-time 45 \
                -O --output-dir "$arch" ||
              echo "parallel fetch incomplete; apt will fetch the rest"
          fi
          retry 120 sudo apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends "${packages[@]}" >/dev/null
          bounded 60 npm install -g agent-browser
          sudo loginctl enable-linger "$USER"
      - name: Save apt package cache
        uses: actions/cache/save@v4
        with:
          path: ~/.apt-debs/*.deb
          key: apt-debs-${{ runner.os }}-labwc-xwayland-sqlite3-${{ github.run_id }}
      - name: Live computer and cleanup tests
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          systemd-run --user --scope --quiet -p TasksMax=600 -p MemoryMax=2G -- go test -count=1 -timeout 5m ./internal/computers
