name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts CI when a draft is released.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit gets a finished run. Newer PR heads replace older PR runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One cheap job decides which suites a change needs. PRs run only the suites
  # their files touch. Main pushes always run everything. Draft PRs run nothing.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      next: ${{ steps.filter.outputs.next }}
      web: ${{ steps.filter.outputs.web }}
      next_pi: ${{ steps.filter.outputs.next_pi }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash next/scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  # next/ is the v2 Go module. Its Go version comes from next/go.mod.
  next:
    name: next
    needs: [changes]
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - name: Format, vet and test
        run: bash next/scripts/ci.sh next
      - name: Provision OpenSSH for integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo usermod -p 'key-only-no-password' "$(id -un)"
      - name: Test SSH reconnect
        working-directory: next
        run: DYNA_REQUIRE_SSHD=1 go test -count=1 -tags integration ./box/podman -run '^TestRealSSHForwardReconnect$' -v
      - name: Test the CI filter and the deploy script
        run: |
          python3 next/scripts/ci-changes-test.py
          bash next/scripts/deploy-trial_test.sh
      - name: Require install.sh to refuse
        # main has no installer yet. A stub that exits 0 would look like an install.
        run: if bash install.sh; then echo 'install.sh must exit nonzero until v2 has an installer' >&2; exit 1; fi

  # The vendored CLIProxyAPI is a separate Go module, so this job uses its go.sum too.
  next-extras:
    name: next-extras
    needs: [changes]
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: |
            next/go.sum
            next/third_party/cliproxyapi/go.sum
      - name: Test the CLIProxyAPI management handler
        run: bash next/scripts/ci.sh next-extras

  next-web:
    name: next-web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/web/package-lock.json
      - name: Check, test and build the web app
        run: bash next/scripts/ci.sh next-web

  next-pi:
    name: next-pi
    needs: [changes]
    if: needs.changes.outputs.next_pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/third_party/pi/package-lock.json
      - name: Build, test and pack v2 Pi
        env:
          JUNIT_REPORT_PATH: ${{ runner.temp }}/next-pi-test.xml
        run: bash next/scripts/ci.sh next-pi
      - name: Upload v2 Pi test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-pi-test-report
          path: ${{ runner.temp }}/next-pi-test.xml
          if-no-files-found: error
          retention-days: 1

  # The Connect relay Cloudflare worker. v2's engine/connect talks to it.
  relay:
    name: relay
    needs: [changes]
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
      - run: npm ci --prefer-offline --no-audit
      - run: npm run typecheck
      - run: npm test
