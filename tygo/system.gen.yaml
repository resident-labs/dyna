packages:
  - path: dyna-agent/internal/sysload
    output_path: web/src/lib/api/system.gen.ts
    include_files: [system_types.go]
    fallback_type: unknown
    preserve_comments: types
    enum_style: union
    frontmatter: |
      import type { Health as WriteHealth } from './system-state.gen.ts'
      import type { Stats as EventStats } from './system-hub.gen.ts'
      type LoadAverage = [number, number, number]
      type SystemLoadBase = Omit<Load, 'top'>

  - path: dyna-agent/internal/database
    output_path: web/src/lib/api/system.gen.ts
    include_files: [system_types.go]
    fallback_type: unknown
    preserve_comments: types
    enum_style: union

  - path: dyna-agent/internal/roomsvc
    output_path: web/src/lib/api/system.gen.ts
    include_files: [system_types.go]
    fallback_type: unknown
    preserve_comments: types
    enum_style: union

  - path: dyna-agent/internal/engine
    output_path: web/src/lib/api/system.gen.ts
    include_files: [system_types.go]
    fallback_type: unknown
    preserve_comments: types
    enum_style: union
    type_mappings:
      state.Health: WriteHealth
      hub.Stats: EventStats
      database.Metrics: Metrics
      sysload.Load: SystemLoadBase
      roomsvc.LoadOwnerCores: LoadOwnerCores
