# Raise versionCode when the app's code or the voice protocol it speaks changes, and only then.
# The engine serves this number (build-apk.sh writes version.json); the app offers an update
# only when the served number is higher than its own. Engine-only changes never raise it.
versionCode=2
# 2 is the first version that opens dyna://pair links; the web page (FIRST_PAIR_LINK in
# web/src/lib/settings/android.ts) offers the Android app only for an engine serving this or newer.
